    body[data-page="index.html"] .home-circle-item::before {
      content: none !important;

    body[data-page="index.html"] .home-research {
      position: relative;

    body[data-page="index.html"] .home-research__overlay {
      position: fixed;
      inset: 0;

      opacity: 0;

      pointer-events: none;

      background-size: cover;
      transition: opacity 0.24s ease, visibility 0.24s ease;

    body[data-page="index.html"] .home-research__overlay::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(12, 33, 65, 0.16), rgba(12, 33, 65, 0.22));

    body[data-page="index.html"] .home-research__grid {
      position: relative;

    body[data-page="index.html"] .home-research__meteors {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    body[data-page="index.html"] .home-research__meteor {
      position: absolute;
      left: var(--meteor-left, 0%);
      top: var(--meteor-top, 0%);
      width: var(--meteor-length, 180px);
      height: var(--meteor-width, 3px);
      border-radius: 999px;
      opacity: 0;
      background: linear-gradient(
        90deg,
        rgba(9, 20, 36, 0) 0%,
        rgba(9, 20, 36, 0.14) 40%,
        rgba(9, 20, 36, 0.92) 100%
      );
      transform: translate3d(-18vw, -18vw, 0) rotate(45deg);
      transform-origin: center;
      animation: homeResearchMeteor var(--meteor-duration, 8s) linear infinite;
      animation-delay: var(--meteor-delay, 0s);
    }

    body[data-page="index.html"] .home-research__ground-wind {
      position: absolute;
      inset: 44% -12% 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 88%, transparent 100%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 88%, transparent 100%);
    }

    body[data-page="index.html"] .home-research__leaf {
      --leaf-color: #6f8b4b;
      position: absolute;
      left: var(--leaf-left, 0%);
      bottom: var(--leaf-bottom, 8%);
      width: var(--leaf-size, 18px);
      aspect-ratio: 1.8 / 1;
      border-radius: 100% 0 100% 0;
      opacity: 0;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.28), transparent 42%),
        var(--leaf-color);
      box-shadow: 0 1px 2px rgba(16, 39, 70, 0.16);
      transform: translate3d(-18vw, 0, 0) rotate(var(--leaf-rotate, 18deg));
      transform-origin: 50% 70%;
      animation: homeResearchLeafGust var(--leaf-duration, 10s) ease-in-out infinite;
      animation-delay: var(--leaf-delay, 0s);
    }

    body[data-page="index.html"] .home-research__leaf::after {
      content: "";
      position: absolute;
      left: 12%;
      top: 50%;
      width: 72%;
      height: 1px;
      background: rgba(59, 70, 38, 0.42);
      transform: rotate(-22deg);
      transform-origin: left center;
    }

    @keyframes homeResearchLeafGust {
      0% {
        opacity: 0;
        transform: translate3d(-18vw, 22px, 0) rotate(var(--leaf-rotate, 18deg));
      }

      12% {
        opacity: 0.78;
      }

      38% {
        transform: translate3d(24vw, -18px, 0) rotate(calc(var(--leaf-rotate, 18deg) + 190deg));
      }

      68% {
        opacity: 0.72;
        transform: translate3d(58vw, 16px, 0) rotate(calc(var(--leaf-rotate, 18deg) + 360deg));
      }

      100% {
        opacity: 0;
        transform: translate3d(116vw, -10px, 0) rotate(calc(var(--leaf-rotate, 18deg) + 540deg));
      }
    }

    @keyframes homeResearchMeteor {
      0% {
        opacity: 0;
        transform: translate3d(-18vw, -18vw, 0) rotate(45deg);
      }

      10% {
        opacity: 0.9;
      }

      75% {
        opacity: 0.8;
      }

      100% {
        opacity: 0;
        transform: translate3d(24vw, 24vw, 0) rotate(45deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body[data-page="index.html"] .home-research__meteor,
      body[data-page="index.html"] .home-research__leaf {
        animation: none;
        opacity: 0.34;
      }

  <script>
    function initResearchOverlay() {
      const section = document.querySelector(".home-research");
      const overlay = section ? section.querySelector(".home-research__overlay") : null;
      const triggers = section ? section.querySelectorAll("[data-overlay-trigger]") : [];

      if (!section || !overlay || !triggers.length || section.classList.contains("home-planetary")) return;

      let activeTrigger = null;

      function activate(trigger) {
        const image = trigger.dataset.overlayImage;
        const color = trigger.dataset.overlayColor || "#0f2748";
        const position = trigger.dataset.overlayPosition || "center center";

        if (activeTrigger && activeTrigger !== trigger) {
          activeTrigger.classList.remove("is-overlay-source");
        }

        activeTrigger = trigger;
        activeTrigger.classList.add("is-overlay-source");
        overlay.style.backgroundImage = image ? 'url("' + image + '")' : "none";
        overlay.style.backgroundColor = color;
        overlay.style.backgroundPosition = position;
        overlay.classList.add("is-active");
      }

      function deactivate() {
        overlay.classList.remove("is-active");
        if (activeTrigger) {
          activeTrigger.classList.remove("is-overlay-source");
          activeTrigger = null;
        }
      }

      triggers.forEach(function (trigger) {
        trigger.addEventListener("mouseenter", function () {
          activate(trigger);
        });

        trigger.addEventListener("mouseleave", function () {
          deactivate();
        });

        trigger.addEventListener("focus", function () {
          activate(trigger);
        });

        trigger.addEventListener("blur", function () {
          deactivate();
        });
      });

      section.addEventListener("mouseleave", function () {
        deactivate();
      });

      window.addEventListener("scroll", function () {
        deactivate();
      }, { passive: true });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initResearchOverlay);
    } else {
      initResearchOverlay();
    }
  </script>
